<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Authentication</title>
    <style>
        body {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
        }

        .login-button {
            background-color: #1DB954;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-button:hover {
            background-color: #1ed760;
            transform: scale(1.05);
        }

        #status {
            margin-top: 1rem;
            color: #b3b3b3;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <button class="login-button" onclick="startAuth()" style="display: none">
            Login with Spotify
        </button>
        <div id="status"></div>
    </div>

    <script>
        const clientId = '87a963b9b7b14d6889a9485fb278c3bb';
        const redirectUri = 'http://127.0.0.1:5500/API/spotify/auth/index.html';
        const scope = 'user-read-playback-state user-modify-playback-state user-read-currently-playing streaming';

        async function handleAuth() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Checking authentication...';

            try {
                // Check localStorage first
                const storedData = localStorage.getItem('spotify_data');
                if (storedData) {
                    const data = JSON.parse(storedData);
                    if (data.token && data.expires_at && Date.now() < data.expires_at) {
                        statusEl.textContent = 'Using existing token...';
                        console.log('Using existing valid token from localStorage');
                        window.location.replace('../auth/index.html');
                        return;
                    }
                }

                // Check for token in URL hash
                const hash = window.location.hash.substring(1);
                if (hash) {
                    const params = new URLSearchParams(hash);
                    const accessToken = params.get('access_token');
                    const expiresIn = params.get('expires_in');
                    
                    if (accessToken) {
                        statusEl.textContent = 'Authentication successful...';
                        
                        // Save to localStorage
                        const expiresAt = Date.now() + (parseInt(expiresIn) * 1000);
                        localStorage.setItem('spotify_data', JSON.stringify({
                            token: accessToken,
                            expires_at: expiresAt
                        }));

                        // Clear hash and redirect
                        window.location.hash = '';
                        console.log('Redirecting to widget...');
                        window.location.replace('../auth/index.html');
                        return;
                    }
                }

                // No valid token found
                console.log('No valid token found, showing login button');
                statusEl.textContent = 'Please log in to continue';
                document.querySelector('.login-button').style.display = 'block';
                
            } catch (error) {
                console.error('Auth error:', error);
                statusEl.textContent = 'Authentication error: ' + error.message;
                document.querySelector('.login-button').style.display = 'block';
            }
        }

        function startAuth() {
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Connecting to Spotify...';
            
            localStorage.clear(); // Clear any existing tokens
            const authUrl = `https://accounts.spotify.com/authorize` +
                `?client_id=${clientId}` +
                `&redirect_uri=${encodeURIComponent(redirectUri)}` +
                `&scope=${encodeURIComponent(scope)}` +
                `&response_type=token` +
                `&show_dialog=true`;
            
            console.log('Starting auth process...');
            window.location.replace(authUrl);
        }

        // Initialize auth page
        window.onload = () => {
            const loginButton = document.querySelector('.login-button');
            loginButton.textContent = 'Login with Spotify';
            handleAuth();
        };
    </script>
</body>
</html>
