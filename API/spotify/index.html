<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Widget</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .spotify-widget {
            position: relative;
            background: linear-gradient(to bottom, rgba(40, 40, 40, 0.8), rgba(20, 20, 20, 0.9));
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            width: 600px;  /* Increased from 500px */
            height: 180px; /* Increased from 150px */
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            gap: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .background-blur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(30px);
            opacity: 0.6;
            z-index: -1;
        }

        .album-art {
            width: 160px;
            height: 160px;
            border-radius: 8px;
            object-fit: cover;
            align-self: center;
            transition: transform 0.3s cubic-bezier(0.215, 0.61, 0.355, 1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .album-art:hover {
            transform: scale(1.05);
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px 0;
            gap: 15px;
        }

        .song-info {
            margin-bottom: 10px;
            animation: fadeIn 0.3s ease;
        }

        .song-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            color: #fff;
            font-weight: 700;
            letter-spacing: -0.04em;
        }

        .artist {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .artist:hover {
            color: #fff;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px; /* Increased gap between buttons */
            margin: 10px 0;
            position: relative;
        }

        .control-btn {
            background: none;
            border: none;
            color: #b3b3b3; /* Spotify's default inactive color */
            cursor: pointer;
            padding: 0;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn i {
            font-size: 18px; /* Size for skip buttons */
        }

        .control-btn.play-pause {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: white;
            color: black;
        }

        .control-btn.play-pause i {
            font-size: 14px; /* Size for play/pause icon */
        }

        .control-btn:hover {
            color: white;
            transform: scale(1.1);
        }

        .control-btn.play-pause:hover {
            background-color: #1ED760;
            color: white;
            transform: scale(1.1);
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            margin: 8px 0 24px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar:hover .progress-handle {
            transform: scale(1);
        }

        .progress-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: white;
            border-radius: 50%;
            top: -4px;
            left: 0;
            transform: translateX(-50%) scale(0);
            transition: transform 0.2s ease;
            pointer-events: none;
        }

        .progress-bar:hover .progress-handle,
        .progress-handle.active {
            transform: translateX(-50%) scale(1);

        }

        .progress-svg {
            width: 100%;
            height: 4px;
            display: block;
        }

        .progress-background {
            fill: rgba(255, 255, 255, 0.1);
        }

        .progress-fill {
            fill: #ffffff;
            transition: width 0.1s linear;
        }
        .progress-bar:hover .progress-fill {
         fill:#1ED760 ;/* Spotify's green */
        }

        /* Remove old progress styles */
        .progress {
            display: none;
        }

        @keyframes fadeIn {
            from { 
                opacity: 0;
                transform: translateY(10px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spotify-logo {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            opacity: 0.7;
            transition: opacity 0.2s ease;
            z-index: 1;
        }

        .spotify-logo:hover {
            opacity: 1;
        }

        /* Add these temporary debug styles */
        .progress-bar {
            border: 1px solid rgba(255, 255, 255, 0.2); /* Makes the container visible */
        }

        .progress {
            background-color: #1DB954;
            min-width: 2px; /* Ensures it's always at least slightly visible */
        }

        .time-info {
            position: absolute;
            width: 100%;
            bottom: -20px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
        }

        .current-time {
            margin-right: auto;
        }

        .duration {
            margin-left: auto;
        }

        .progress-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="spotify-widget">
        <div class="background-blur"></div>
        <svg class="spotify-logo" viewBox="0 0 2931 2931" fill="currentColor" onclick="window.location.href='https://open.spotify.com/'">
            <path d="M1465.5 0C656.1 0 0 656.1 0 1465.5S656.1 2931 1465.5 2931 2931 2274.9 2931 1465.5C2931 656.2 2274.9.1 1465.5 0zm672.1 2113.6c-26.3 43.2-82.6 56.7-125.6 30.4-344.1-210.3-777.3-257.8-1287.4-141.3-49.2 11.3-98.2-19.5-109.4-68.7-11.3-49.2 19.4-98.2 68.7-109.4C1185.4 1681.5 1656.2 1735 2036 1965.6c43 26.5 56.7 82.6 30.4 125.6zm179.3-398.9c-33.1 53.8-103.5 70.6-157.2 37.6-393.8-242.1-994.4-312.2-1460.3-170.8-60.4 18.3-124.2-15.8-142.6-76.1-18.2-60.4 15.9-124.1 76.2-142.5 532.2-161.5 1193.9-83.3 1646.1 194.7 53.8 33.1 70.8 103.4 37.8 157.1zm15.4-415.6c-472.4-280.5-1251.6-306.3-1702.6-169.5-72.4 22-149-18.9-170.9-91.3-21.9-72.4 18.9-149 91.4-171 517.7-157.1 1378.2-126.8 1922 196 65.1 38.7 86.5 122.8 47.9 187.8-38.5 65.2-122.8 86.7-187.8 48z"/>
        </svg>
        <img src="https://placehold.co/400x400" alt="Album Cover" class="album-art">
        <div class="content">
            <div class="song-info">
                <div class="song-title">Song Title</div>
                <div class="artist">Artist Name</div>
            </div>
            <div class="controls">
                <button class="control-btn"><i class="fas fa-backward-step"></i></button>
                <button class="control-btn play-pause"><i class="fas fa-play"></i></button>
                <button class="control-btn"><i class="fas fa-forward-step"></i></button>
            </div>
            <div class="progress-container">
                <div class="progress-bar">
                    <svg class="progress-svg" width="100%" height="4">
                        <rect class="progress-background" x="0" y="0" width="100%" height="4" rx="2"/>
                        <rect class="progress-fill" x="0" y="0" width="0%" height="4" rx="2"/>
                    </svg>
                    <div class="progress-handle"></div>
                    <div class="time-info">
                        <span class="current-time">0:00</span>
                        <span class="duration">0:00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script>
        const clientId = '87a963b9b7b14d6889a9485fb278c3bb';
        const redirectUri = 'http://127.0.0.1:5500/API/spotify/auth/index.html';
        
        // Single source of truth for token
        let accessToken = null;

        // Replace the getTokenFromUserJson function with this simpler version:
        async function getTokenFromStorage() {
            try {
                const storedData = localStorage.getItem('spotify_data');
                if (storedData) {
                    const data = JSON.parse(storedData);
                    if (data.token && data.expires_at) {
                        if (Date.now() < data.expires_at) {
                            console.log('Valid token found in localStorage');
                            return data.token;
                        } else {
                            console.log('Token expired, cleaning up...');
                            localStorage.removeItem('spotify_data');
                        }
                    }
                }
                return null;
            } catch (error) {
                console.error('Error reading token:', error);
                return null;
            }
        }

        async function init() {
            try {
                accessToken = await getTokenFromStorage();
                
                if (!accessToken) {
                    console.log('No token found, redirecting to auth...');
                    redirectToAuth();
                    return;
                }

                const isValid = await validateToken();
                if (!isValid) {
                    console.log('Token invalid, cleaning up...');
                    localStorage.removeItem('spotify_data');
                    redirectToAuth();
                    return;
                }

                console.log('Token valid, initializing player...');
                await getCurrentPlayback();
                
                // Reducir la frecuencia de actualización a cada 3 segundos
                setInterval(getCurrentPlayback, 3000);
                
            } catch (error) {
                console.error('Initialization error:', error);
                // Solo redirigir si no hay token
                if (!accessToken) {
                    redirectToAuth();
                }
            }
        }

        function redirectToAuth() {
            console.log('Redirecting to auth page...');
            localStorage.removeItem('spotify_data'); // Clear invalid token
            window.location.replace('./auth/index.html');
        }

        // Simplify validateToken
        async function validateToken() {
            try {
                const response = await fetch('https://api.spotify.com/v1/me', {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                return response.ok;
            } catch (error) {
                console.error('Token validation error:', error);
                return false;
            }
        }

        // Update error handling in all fetch calls
        async function handleSpotifyAPI(endpoint, method = 'GET') {
            try {
                const response = await fetch(`https://api.spotify.com/v1${endpoint}`, {
                    method,
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                // Solo redirigir si es un error de autenticación y no tenemos token
                if (response.status === 401 && !accessToken) {
                    redirectToAuth();
                    return null;
                }

                // Para otros errores, simplemente retornar null
                if (!response.ok) {
                    console.warn(`API call failed: ${response.status}`);
                    return null;
                }

                return response.status !== 204 ? await response.json() : null;
            } catch (error) {
                console.error('Spotify API error:', error);
                return null;
            }
        }

        // Update event listeners
        const playPauseBtn = document.querySelector('.control-btn:nth-child(2)');
        const prevBtn = document.querySelector('.control-btn:nth-child(1)');
        const nextBtn = document.querySelector('.control-btn:nth-child(3)');

        playPauseBtn.addEventListener('click', async () => {
            try {
                const state = await handleSpotifyAPI('/me/player');
                const endpoint = state.is_playing ? '/me/player/pause' : '/me/player/play';
                await handleSpotifyAPI(endpoint, 'PUT');
                await getCurrentPlayback();
            } catch (error) {
                console.error('Playback control error:', error);
            }
        });

        prevBtn.addEventListener('click', async () => {
            try {
                await handleSpotifyAPI('/me/player/previous', 'POST');
                await getCurrentPlayback();
            } catch (error) {
                console.error('Playback control error:', error);
            }
        });

        nextBtn.addEventListener('click', async () => {
            try {
                await handleSpotifyAPI('/me/player/next', 'POST');
                await getCurrentPlayback();
            } catch (error) {
                console.error('Playback control error:', error);
            }
        });

        // Get current player state
        async function getCurrentPlayback() {
            try {
                const data = await handleSpotifyAPI('/me/player');
                if (data) {
                    window.currentPlaybackData = data; // Guardar datos
                    updateUI(data);
                } else {
                    console.log('No playback data available');
                }
            } catch (error) {
                console.error('Playback state error:', error);
            }
        }

        // Add these functions to your JavaScript section:

        let progressInterval;

        function startProgressUpdate(startMs, durationMs) {
            if (progressInterval) clearInterval(progressInterval);
            
            let currentMs = startMs;
            const data = window.currentPlaybackData;
            const isPlaying = data && data.is_playing;

            function updateProgressUI(current, total) {
                const percent = (current / total) * 100;
                
                // Actualizar fill
                const progressFill = document.querySelector('.progress-fill');
                if (progressFill) {
                    progressFill.setAttribute('width', `${percent}%`);
                }
                
                // Actualizar handle
                updateHandlePosition(percent);
                
                // Actualizar tiempo
                const currentTime = document.querySelector('.current-time');
                if (currentTime) {
                    currentTime.textContent = formatTime(current);
                }
            }

            // Initial update
            updateProgressUI(currentMs, durationMs);

            // Solo iniciar el intervalo si la canción está reproduciéndose
            if (isPlaying) {
                progressInterval = setInterval(() => {
                    if (!isDragging && currentMs < durationMs) {
                        currentMs += 1000;
                        updateProgressUI(currentMs, durationMs);
                    }
                }, 1000);
            }
        }

        // Actualizar la función updateUI
        function updateUI(data) {
            const albumArt = document.querySelector('.album-art');
            const songTitle = document.querySelector('.song-title');
            const artist = document.querySelector('.artist');
            const progress = document.querySelector('.progress');
            const backgroundBlur = document.querySelector('.background-blur');
            const playPauseBtn = document.querySelector('.control-btn.play-pause');
            const currentTime = document.querySelector('.current-time');
            const duration = document.querySelector('.duration');
            const handle = document.querySelector('.progress-handle');

            if (data.item) {
                albumArt.src = data.item.album.images[0].url;
                songTitle.textContent = data.item.name;
                artist.textContent = data.item.artists.map(artist => artist.name).join(', ');
                backgroundBlur.style.backgroundImage = `url(${data.item.album.images[0].url})`;
                
                // Start progress updates
                startProgressUpdate(data.progress_ms, data.item.duration_ms);
                
                // Actualizar barra de progreso y handler
                const progressPercent = (data.progress_ms / data.item.duration_ms) * 100;
                const progressFill = document.querySelector('.progress-fill');
                if (progressFill) {
                    progressFill.setAttribute('width', `${progressPercent}%`);
                    updateHandlePosition(progressPercent);
                }
                
                playPauseBtn.innerHTML = data.is_playing ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            }
            
            if (duration) {
                duration.textContent = formatTime(data.item.duration_ms);
            }
            
            // Actualizar la posición del handle
            updateHandlePosition(progressPercent);
        }

        // Agregar función para actualizar posición del handle
        function updateHandlePosition(percent) {
            const handle = document.querySelector('.progress-handle');
            if (handle) {
                handle.style.left = `${percent}%`;
            }
        }

        // Update the seekToPosition function:
        async function seekToPosition(percent) {
            try {
                const data = await handleSpotifyAPI('/me/player');
                if (data && data.item) {
                    const position = Math.floor(data.item.duration_ms * percent);
                    await handleSpotifyAPI(`/me/player/seek?position_ms=${position}`, 'PUT');
                    
                    // Restart progress updates from new position
                    startProgressUpdate(position, data.item.duration_ms);
                    
                    await getCurrentPlayback();
                }
            } catch (error) {
                console.error('Seek error:', error);
            }
        }

        // Add this to your JavaScript section, before the window.onload
        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // Enhanced progress bar interaction
        const progressBar = document.querySelector('.progress-bar');
        let isDragging = false;

        progressBar.addEventListener('mousedown', (e) => {
            isDragging = true;
            const handle = document.querySelector('.progress-handle');
            handle.classList.add('active');
            updateProgressFromEvent(e);
            
            // Prevenir la selección de texto mientras se arrastra
            e.preventDefault();
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                const handle = document.querySelector('.progress-handle');
                handle.classList.remove('active');
                
                // Actualizar posición final
                const percent = parseFloat(document.querySelector('.progress-fill').getAttribute('width')) / 100;
                seekToPosition(percent);
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                updateProgressFromEvent(e);
            }
        });

        function updateProgressFromEvent(e) {
            if (!isDragging) return;

            const rect = progressBar.getBoundingClientRect();
            const percent = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
            
            // Actualizar visualmente sin esperar la API
            const progressFill = document.querySelector('.progress-fill');
            const width = `${percent * 100}%`;
            progressFill.setAttribute('width', width);

            // Actualizar posición del handler inmediatamente
            updateHandlePosition(percent * 100);
            
            // Actualizar tiempo actual
            const data = window.currentPlaybackData;
            if (data && data.item) {
                const newTime = Math.floor(data.item.duration_ms * percent);
                document.querySelector('.current-time').textContent = formatTime(newTime);
            }
        }

        // Eliminar smoothProgressUpdate y otras funciones innecesarias
        // Eliminar las siguientes líneas al final del archivo:
        // smoothProgressUpdate();
        // lastUpdateTime = 0;

        // Add this before the init() function
        window.onSpotifyWebPlaybackSDKReady = () => {
            const player = new Spotify.Player({
                name: 'Cortana Web Player',
                getOAuthToken: cb => { cb(accessToken); }
            });

            // Error handling
            player.addListener('initialization_error', ({ message }) => {
                console.error(message);
            });

            player.addListener('authentication_error', ({ message }) => {
                console.error(message);
                redirectToAuth();
            });

            player.addListener('account_error', ({ message }) => {
                console.error(message);
            });

            player.addListener('playback_error', ({ message }) => {
                console.error(message);
            });

            // Playback status updates
            player.addListener('player_state_changed', state => {
                console.log(state);
                if (state) {
                    updateUI({
                        item: state.track_window.current_track,
                        is_playing: !state.paused,
                        progress_ms: state.position
                    });
                }
            });

            // Ready
            player.addListener('ready', ({ device_id }) => {
                console.log('Ready with Device ID', device_id);
            });

            // Not Ready
            player.addListener('not_ready', ({ device_id }) => {
                console.log('Device ID has gone offline', device_id);
            });

            // Connect to the player
        };

        // Start initialization
        window.onload = init;

        // Mejorar la actualización del progreso
        let lastUpdateTime = 0;
        
        function smoothProgressUpdate() {
            if (!isDragging) {
                const progress = document.querySelector('.progress');
                const currentWidth = parseFloat(progress.style.width) || 0;
                const newWidth = Math.min(currentWidth + 0.1, 100);
                progress.style.width = `${newWidth}%`;
            }
            requestAnimationFrame(smoothProgressUpdate);
        }

        // Añadir efectos hover más suaves
        document.querySelectorAll('.control-btn').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                btn.style.transform = 'scale(1.1)';
            });
            
            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'scale(1)';
            });
        });

        // Mejorar la respuesta del drag
        let lastDragUpdate = 0;
        
        document.addEventListener('mousemove', async (e) => {
            if (isDragging) {
                const now = Date.now();
                if (now - lastDragUpdate > 50) { // Limitar actualizaciones a 20fps
                    const rect = progressBar.getBoundingClientRect();
                    const percent = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
                    updateProgressPosition(percent);
                    lastDragUpdate = now;
                }
            }
        });

        // Iniciar la animación suave del progreso
        // smoothProgressUpdate();
    </script>
</body>
</html>
