        <div class="camera-container" id="cameraContainer">

                    <video id="faceCamera" autoplay playsinline></video>
                </div>
            </div>

                <dotlottie-player
                src="https://lottie.host/d1c2645a-cc61-4f5f-8f8e-acb7026b174b/vefzydo9Ws.lottie"
                background="transparent"
                speed="1"
                autoplay
              ></dotlottie-player>
            </div>
            <h2 class="setup-title">¡Configuración Exitosa!</h2>
            <p class="setup-description">El reconocimiento facial ha sido configurado correctamente</p>
            <button class="setup-button" onclick="window.location.href='../Fingerprint/index.html'">Siguiente</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const spinner = document.querySelector('.spinner-container');
            const setupContainer = document.querySelector('.setup-container');
            const cameraContainer = document.querySelector('.camera-container');
            const successContainer = document.querySelector('.success-container');
            const startButton = document.getElementById('startFaceSetup');
            const skipButton = document.getElementById('skipSetup');
            const video = document.getElementById('faceCamera');
            const circle = document.querySelector('.progress-ring__circle');
            const captureStatus = document.querySelector('.capture-status');

            // Set up progress ring
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            let progress = 0;
            let photos = 0;
            const requiredPhotos = 20;

            // Initialize progress ring
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = circumference;

            function setProgress(percent) {
                const offset = circumference - (percent / 100 * circumference);
                circle.style.strokeDashoffset = offset;
            }

            async function capturePhoto() {
                if (!video.srcObject) return;

                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                try {
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));
                    const file = new File([blob], `face_${photos}.jpg`, { type: 'image/jpeg' });
                    
                    // Increment progress
                    photos++;
                    progress = (photos / requiredPhotos) * 100;
                    setProgress(progress);

                    // Check if we're done
                    if (photos >= requiredPhotos) {
                        completeCapture();
                    }
                } catch (err) {
                    console.error('Error capturing photo:', err);
                }
            }

            function completeCapture() {
                const cameraContainer = document.querySelector('.camera-container');
                const successContainer = document.querySelector('.success-container');
                
                // Stop video stream
                if (video.srcObject) {
                    const stream = video.srcObject;
                    const tracks = stream.getTracks();
                    tracks.forEach(track => track.stop());
                }
                
                // Hide camera container
                cameraContainer.style.opacity = '0';
                setTimeout(() => {
                    cameraContainer.style.display = 'none';
                    // Show success container
                    successContainer.style.display = 'block';
                    successContainer.style.opacity = '1';
                }, 300);
                
                localStorage.setItem('faceSetupCompleted', 'true');
            }

            function skipFaceSetup() {
                localStorage.setItem('faceSetupSkipped', 'true');
                window.location.href = '/SmartHealthyHouse/www/Index.html';
            }

            // Start face setup
            startButton.addEventListener('click', async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "user" } 
                    });
                    
                    video.srcObject = stream;
                    setupContainer.style.opacity = '0';
                    
                    setTimeout(() => {
                        setupContainer.style.display = 'none';
                        cameraContainer.style.display = 'flex';
                        cameraContainer.style.opacity = '1';
                        
                        const captureInterval = setInterval(() => {
                            if (photos < requiredPhotos) {
                                capturePhoto();
                            } else {
                                clearInterval(captureInterval);
                            }
                        }, 500);
                    }, 300);

                } catch (err) {
                    console.error('Error accessing camera:', err);
                    skipFaceSetup();
                }
            });

            // Skip button handler
            skipButton.addEventListener('click', skipFaceSetup);

            // Hide loading spinner
            setTimeout(() => {
                spinner.style.opacity = '0';
                spinner.style.visibility = 'hidden';
            }, 5000);
        });
    </script>
