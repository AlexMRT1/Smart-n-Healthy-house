  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <style>
        :root {
            --gradient-bg: linear-gradient(to bottom, #f5f7fa, #e4e8ec);
            --blue-accent: #4A90E2;
            --primary-color: #4a90e2;
            --primary-dark: #357abd;
        }
        
        .site-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: var(--padding-mobile);
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            z-index: 3000; /* Aumentado para estar por encima del menú */
        }

        .site-title {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: bold;
            color: #1a1a1a;
            margin-right: 2rem;
            z-index: 3000; /* Aumentado para estar por encima del menú */
        }

        .beta-badge {
            background: var(--primary-color);
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 12px;
            font-size: 1rem;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--gradient-bg);
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
        }

        .animation-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 2rem auto;
        }

        .bluetooth-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-47%, -50%);
            width: 60px;
            height: 60px;
            fill: var(--blue-accent);
            z-index: 2;
        }

        .pulse-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid var(--blue-accent);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(-50%, -50%);
            }
            50% {
                transform: translate(-50%, calc(-50% - 10px));
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(74, 144, 226, 0.7);
            }
            70% {
                transform: scale(1);
                opacity: 0.6;
                box-shadow: 0 0 0 60px rgba(74, 144, 226, 0);
            }
            100% {
                transform: scale(0.8);
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(74, 144, 226, 0);
            }
        }
        .success-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-47%, -50%);
    width: 70px;
    height: 70px;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.3s ease;
    display: none;
}

.success-icon.visible {
    opacity: 1;
    display: block;
}
        h1 {
            color: #333;
            font-size: 1.5rem;
            margin: 0 0 1rem;
        }

        .status-text {
            color: #666;
            margin: 1rem 0;
            animation: fadeInOut 2s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @media (prefers-reduced-motion: reduce) {
            .bluetooth-icon, .pulse-ring, .status-text {
                animation: none;
            }
        }

        @media (max-width: 480px) {
            .animation-container {
                width: 120px;
                height: 120px;
            }
            
            .bluetooth-icon {
                width: 40px;
                height: 40px;
            }
        }

        .success-animation {
            border-color: #4CAF50;
            animation: success 0.5s ease-in-out forwards;
        }

        .error-animation {
            border-color: #FF4444;
            animation: error 0.5s ease-in-out forwards;
        }

        @keyframes success {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { 
                transform: scale(1);
                box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            }
        }

        @keyframes error {
            0%, 100% { transform: scale(1); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .hidden {
            display: none;
        }

        .error-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-47%, -50%);
            width: 70px;
            height: 70px;
            fill: #FF4444;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s ease;
            display: none;
        }

        .error-icon.visible {
            opacity: 1;
            display: block;
        }

        .search-button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 1rem;
            display: none;
        }

        .search-button:hover {
            background: var(--primary-dark);
        }

        .search-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .brave .search-button {
            display: inline-block;
        }
    </style>
</head>
<body>

        </svg>
    </div>

        Smart'n Healthy House
        <span class="beta-badge">Beta</span>
    </span>

    <h1>Buscando tu Dispositivo</h1>
    <div class="animation-container">
        <svg class="bluetooth-icon" viewBox="0 0 320 512">
            <path d="M196.5 260l92.6-103.3L143.1 0v206.3l-86.1-86.1-31.4 31.4 108.1 108.4L25.6 368.4l31.4 31.4 86.1-86.1L145.8 512l148.6-148.6-97.9-103.3zm40.9-103l-50 50-.3-100.3 50.3 50.3zM187.4 313l50 50-50.3 50.3 .3-100.3z"/>
        </svg>
     <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" class="error-icon"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>
     <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="success-icon">
        <path d="M470.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L192 338.7 425.4 105.4c12.5-12.5 32.8-12.5 45.3 0z" fill="#4CAF50"/>
     </svg>
        <div class="pulse-ring"></div>
    </div>
    <p class="status-text">Buscando dispositivos Smart'n Healthy...</p>
    <button id="searchButton" class="search-button">Buscar Dispositivo</button>

    <script>
        let connectionAttempts = 0;
        const MAX_ATTEMPTS = 3;
        const RETRY_DELAY = 5000;
        const INITIAL_DELAY = 3000;

        async function connectToDevice(device) {
            try {
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService('generic_access');
                const characteristic = await service.getCharacteristic('gap.device_name');
                
                document.querySelector('.pulse-ring').classList.add('success-animation');
                document.querySelector('.status-text').textContent = '¡Conectado exitosamente!';
                
                // Setup device monitoring
                device.addEventListener('gattserverdisconnected', handleDisconnection);
                return true;
            } catch (error) {
                console.error('Connection error:', error);
                return false;
            }
        }

        function handleDisconnection() {
            showError('Dispositivo desconectado. Intentando reconectar...');
            retryConnection();
        }

        async function checkBluetoothAvailability() {
            if (!navigator.bluetooth) {
                throw new Error('Tu navegador no es compatible con Bluetooth. Te recomendamos usar Chrome o Edge para conectar tu dispositivo.');
            }

            try {
                await navigator.bluetooth.getAvailability();
            } catch (error) {
                throw new Error('Por favor, asegúrate de que el Bluetooth de tu dispositivo está activado.');
            }
        }

        async function searchBluetoothDevice() {
            try {
                await checkBluetoothAvailability();
                
                document.querySelector('.status-text').textContent = 'Buscando dispositivos cercanos...';
                document.querySelector('.bluetooth-icon').style.display = 'block';
                document.querySelector('.error-icon').classList.remove('visible');
                
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{
                        namePrefix: 'Smart{n}device'
                    }],
                    optionalServices: ['generic_access']
                });

                if (device.name && device.name.includes('Smart{n}device')) {
                    document.querySelector('.status-text').textContent = 'Dispositivo encontrado. Conectando...';
                    const connected = await connectToDevice(device);
                    
                    if (!connected) {
                        throw new Error('Failed to connect');
                    }
                    return true;
                }
            } catch (error) {
                console.error('Error:', error);
                let errorMessage = 'No se pudo conectar al dispositivo.';
                
                if (error.message.includes('globally disabled')) {
                    errorMessage = 'El Bluetooth está desactivado. Por favor actívalo en la configuración de tu dispositivo.';
                } else if (error.message.includes('User cancelled')) {
                    errorMessage = 'Búsqueda cancelada. Intenta de nuevo cuando estés listo.';
                } else if (error.message.includes('Device not found')) {
                    errorMessage = 'No encontramos ningún dispositivo Smart\'n Healthy cercano. Asegúrate de que está encendido y cerca.';
                }
                
                showError(errorMessage);
                return false;
            }
        }

        function showError(message) {
            document.querySelector('.bluetooth-icon').style.display = 'none';
            document.querySelector('.error-icon').classList.add('visible');
            document.querySelector('.pulse-ring').classList.add('error-animation');
            document.querySelector('.status-text').textContent = message;
        }

        function showErrorDetails() {
            const errorList = document.createElement('ul');
            errorList.style.textAlign = 'left';
            errorList.style.margin = '1rem auto';
            errorList.style.maxWidth = '300px';
            errorList.innerHTML = `
                <li>El dispositivo está encendido</li>
                <li>Está dentro del rango de alcance (10 metros)</li>
                <li>El Bluetooth de su dispositivo está activado</li>
                <li>No hay otros dispositivos conectados</li>
            `;
            document.querySelector('.status-text').appendChild(errorList);
        }

        function showRetrying() {
            connectionAttempts++;
            const remainingAttempts = MAX_ATTEMPTS - connectionAttempts;
            document.querySelector('.status-text').textContent = 
                `Reintentando conectar... (${remainingAttempts} intentos restantes)`;
            
            setTimeout(async () => {
                await searchBluetoothDevice();
            }, RETRY_DELAY);
        }

        function simulateSuccessfulConnection() {
            // Limpiar cualquier estado de error previo
            document.querySelector('.pulse-ring').classList.remove('error-animation');
            document.querySelector('.error-icon').classList.remove('visible');
            
            // Simular búsqueda inicial
            document.querySelector('.status-text').textContent = 'Buscando dispositivos cercanos...';
            
            setTimeout(() => {
                // Mostrar mensaje de dispositivo encontrado
                document.querySelector('.status-text').textContent = 'Dispositivo encontrado. Conectando...';
                // Ocultar icono bluetooth y mostrar icono de éxito
                document.querySelector('.bluetooth-icon').style.display = 'none';
                document.querySelector('.success-icon').classList.add('visible');
                
                setTimeout(() => {
                    // Agregar animación de éxito al anillo
                    document.querySelector('.pulse-ring').classList.add('success-animation');
                    document.querySelector('.status-text').textContent = '¡Conectado exitosamente!';
                    
                    // Redireccionar después de mostrar el éxito
                    setTimeout(() => {
                        window.location.href = './wifi/index.html';
                    }, 2000);
                }, 1500);
            }, 1000);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const searchButton = document.getElementById('searchButton');
            
            if (navigator.brave !== undefined || /brave/i.test(navigator.userAgent)) {
                document.body.classList.add('brave');
                searchButton.addEventListener('click', async () => {
                    searchButton.disabled = true;
                    try {
                        await searchBluetoothDevice();
                    } catch (error) {
                        showError('No pudimos conectar con tu dispositivo. Por favor, inténtalo de nuevo.');
                    } finally {
                        searchButton.disabled = false;
                    }
                });
            } else {
                try {
                    await checkBluetoothAvailability();
                    setTimeout(async () => {
                        try {
                            await searchBluetoothDevice();
                        } catch (error) {
                            showError('No pudimos conectar con tu dispositivo. Por favor, inténtalo de nuevo.');
                        }
                    }, INITIAL_DELAY);
                } catch (error) {
                    showError(error.message);
                }
            }
        });

        document.addEventListener('keydown', (event) => {
            // Detectar Ctrl+X
            if (event.ctrlKey && event.key.toLowerCase() === 'x') {
                event.preventDefault(); // Prevenir el comportamiento por defecto
                simulateSuccessfulConnection();
            }
        });

        const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (mediaQuery.matches) {
            document.querySelector('.bluetooth-icon').style.animation = 'none';
            document.querySelector('.pulse-ring').style.animation = 'none';
            document.querySelector('.status-text').style.animation = 'none';
        }
    </script>
