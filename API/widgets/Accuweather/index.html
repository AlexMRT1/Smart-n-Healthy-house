<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widgets Clima</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f8ff;
            gap: 2rem;
        }

        .weather-widget {
            position: relative;
            width: 400px;
            height: 300px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .wind-widget {
            position: relative;
            width: 800px;
            height: 300px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .title {
            font-family: 'Arial', sans-serif;
            font-size: 1.5rem;
            color: #5a7089;
            text-align: center;
            margin-bottom: 1rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .temperature, .wind-speed {
            font-family: 'Arial', sans-serif;
            font-size: 7rem;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            letter-spacing: -4px;
        }

        .wind-details {
            display: flex;
            gap: 4rem;
            margin-top: 1rem;
        }

        .wind-detail {
            text-align: center;
        }

        .wind-label {
            font-family: 'Arial', sans-serif;
            color: #5a7089;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .wind-value {
            font-family: 'Arial', sans-serif;
            color: #2c3e50;
            font-size: 2rem;
            font-weight: bold;
        }

        .container {
            display: flex;
            gap: 2rem;
        }

        .weather-condition-widget {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .weather-icon {
            width: 70%;
            height: 70%;
        }

        .widget-row {
            display: flex;
            gap: 2rem;
            justify-content: center;
            align-items: flex-start;
        }

        .left-widgets {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .widget-column {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            align-items: center;
        }

        .yellow {
            fill: #FFC107;
        }

        .white {
            fill: #FFFFFF;
        }

        .gray {
            fill: #E0E0E0;
        }

        .air-quality-widget {
            width: 400px;
            height: 300px;
            margin: 0;
            position: relative;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .aqi-value {
            font-family: 'Arial', sans-serif;
            font-size: 4rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 1rem 0;
        }

        .aqi-label {
            font-family: 'Arial', sans-serif;
            font-size: 1.2rem;
            color: #5a7089;
            margin-bottom: 0.5rem;
        }

        .aqi-description {
            font-family: 'Arial', sans-serif;
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 2rem;
        }

        .air-quality-scale {
            width: 80%;
            height: 15px;
            background: linear-gradient(to right, 
                #00e400 0%, 
                #ffff00 25%, 
                #ff7e00 50%, 
                #ff0000 75%, 
                #7e0023 100%
            );
            border-radius: 8px;
            position: relative;
        }

        .air-quality-indicator {
            position: absolute;
            width: 25px;
            height: 25px;
            background-color: #fff;
            border: 3px solid #2c3e50;
            border-radius: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            transition: left 0.3s ease;
        }

        .pollutant-details {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
        }

        .pollutant {
            text-align: center;
        }

        .pollutant-value {
            font-family: 'Arial', sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .pollutant-label {
            font-family: 'Arial', sans-serif;
            font-size: 0.9rem;
            color: #5a7089;
        }

        .precipitation-widget {
            position: relative;
            width: 400px;
            height: 300px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .precipitation-chance {
            font-family: 'Arial', sans-serif;
            font-size: 7rem;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            letter-spacing: -4px;
        }

        .precipitation-label {
            font-family: 'Arial', sans-serif;
            color: #5a7089;
            font-size: 1.2rem;
            margin-top: 1rem;
        }

        .visibility-widget {
            position: relative;
            width: 400px;
            height: 300px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .visibility-value {
            font-family: 'Arial', sans-serif;
            font-size: 7rem;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            letter-spacing: -4px;
        }

        .visibility-unit {
            font-family: 'Arial', sans-serif;
            color: #5a7089;
            font-size: 1.2rem;
            margin-top: 1rem;
        }

        .uv-widget {
            position: relative;
            width: 400px;
            height: 300px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .uv-value {
            font-family: 'Arial', sans-serif;
            font-size: 7rem;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            letter-spacing: -4px;
        }

        .uv-description {
            font-family: 'Arial', sans-serif;
            font-size: 1.2rem;
            color: #5a7089;
            margin-top: 1rem;
        }
        
        @keyframes fadeIn {
            from { 
                opacity: 0;
                transform: translateY(10px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>
<body>
    <div class="widget-column">
        <!-- Primera fila -->
        <div class="widget-row">
            <div class="left-widgets">
                <div class="weather-widget">
                    <div class="title">Temperatura Exterior</div>
                    <div class="temperature">24°C</div>
                    <div class="location">CDMX</div>
                </div>

                
            </div>

            <div class="wind-widget">
                <div class="title">Viento</div>
                <div class="wind-speed">12 km/h</div>
                <div class="wind-details">
                    <div class="wind-detail">
                        <div class="wind-label">Dirección</div>
                        <div class="wind-value">NE</div>
                    </div>
                    <div class="wind-detail">
                        <div class="wind-label">Ráfagas</div>
                        <div class="wind-value">25 km/h</div>
                    </div>
                </div>
            </div>
            
            <div class="precipitation-widget">
                <div class="title">Probabilidad de Lluvia</div>
                <div class="precipitation-chance">30%</div>
                <div class="precipitation-label">Probabilidad de precipitación</div>
            </div>
        </div>

        <!-- Segunda fila -->
        <div class="widget-row">
            <div class="weather-condition-widget">
                <!-- SVG para día soleado -->
                <svg class="weather-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <!-- Sol -->
                    <circle cx="50" cy="50" r="20" fill="#FFD700"/>
                    <g stroke="#FFD700" stroke-width="4">
                        <!-- Rayos del sol -->
                        <line x1="50" y1="15" x2="50" y2="5"/>
                        <line x1="50" y1="85" x2="50" y2="95"/>
                        <line x1="15" y1="50" x2="5" y2="50"/>
                        <line x1="85" y1="50" x2="95" y2="50"/>
                        <!-- Rayos diagonales -->
                        <line x1="25" y1="25" x2="15" y2="15"/>
                        <line x1="75" y1="25" x2="85" y2="15"/>
                        <line x1="25" y1="75" x2="15" y2="85"/>
                        <line x1="75" y1="75" x2="85" y2="85"/>
                    </g>
                </svg>
            </div>

            <div class="visibility-widget">
                <div class="title">Visibilidad</div>
                <div class="visibility-value">10</div>
                <div class="visibility-unit">kilómetros</div>
            </div>

            <div class="air-quality-widget">
                <div class="title">Calidad del Aire</div>
                <div class="aqi-description">Moderado</div>
                <div class="air-quality-scale">
                    <div class="air-quality-indicator"></div>
                </div>
            </div>

            <div class="uv-widget">
                <div class="title">Índice UV</div>
                <div class="uv-value">6</div>
                <div class="uv-description">Moderado</div>
            </div>
        </div>
    </div>

// Función para actualizar el icono
function updateWeatherIcon(condition) {
    const weatherWidget = document.querySelector('.weather-condition-widget');
    weatherWidget.innerHTML = weatherIcons[condition] || weatherIcons.sunny;
}

// Función para actualizar la calidad del aire
function updateAirQuality(quality) {
    const states = {
        bueno: { position: '12.5%' },
        moderado: { position: '37.5%' },
        malo: { position: '62.5%' },
        peligroso: { position: '87.5%' }
    };
    
    const description = document.querySelector('.aqi-description');
    const indicator = document.querySelector('.air-quality-indicator');
    
    description.textContent = quality.charAt(0).toUpperCase() + quality.slice(1);
    indicator.style.left = states[quality].position;
}

// Simplifica los comandos de teclado
document.addEventListener('keydown', (e) => {
    switch(e.key) {
        case '1':
            updateWeatherIcon('sunny');
            console.log('Cambiado a: Soleado');
            break;
        case '2':
            updateWeatherIcon('cloudy');
            console.log('Cambiado a: Nublado');
            break;
        case '3':
            updateWeatherIcon('rainy');
            console.log('Cambiado a: Lluvia');
            break;
        case '4':
            updateWeatherIcon('storm');
            console.log('Cambiado a: Tormenta');
            break;
    }
});

// Mostrar instrucciones en la consola
console.log('Comandos disponibles:');
console.log('Presiona 1: Soleado');
console.log('Presiona 2: Nublado');
console.log('Presiona 3: Lluvia');
console.log('Presiona 4: Tormenta');

// Inicializar con calidad moderada
updateAirQuality('moderado');
    </script>
</body>
