<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widgets Clima</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
/* Primero, simplificar el diseño base */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #f0f8ff;
    padding: 0;
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
}

.widget-column {
    display: grid;
    gap: 0.5rem;
    padding: 0.5rem;
    width: 100%;
    height: 100vh;
}

/* Estilos base simplificados para widgets */
.weather-widget,
.wind-widget,
.precipitation-widget,
.visibility-widget,
.air-quality-widget,
.uv-widget,
.weather-condition-widget {
    background: #fff;
    border-radius: 12px;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* Media query específico para móviles */
@media screen and (max-width: 768px) {
    .widget-column {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
        padding: 0.5rem;
        height: auto;
    }

    /* Simplificar widgets */
    .weather-widget,
    .wind-widget,
    .precipitation-widget,
    .visibility-widget,
    .air-quality-widget,
    .uv-widget,
    .weather-condition-widget {
        aspect-ratio: 1/1;
        padding: 0.75rem;
        background: #fff;
        border-radius: 12px;
        box-shadow: none;
    }

    /* Ajustar tamaños de texto */
    .title {
        font-size: 0.875rem;
        margin-bottom: 0.5rem;
    }

    .temperature,
    .wind-speed,
    .precipitation-chance,
    .visibility-value,
    .uv-value {
        font-size: 2rem;
        letter-spacing: -1px;
    }

    .location {
        font-size: 0.875rem;
    }

    /* Ajustar detalles del viento */
    .wind-details {
        gap: 1rem;
        margin-top: 0.5rem;
    }

    .wind-label {
        font-size: 0.75rem;
    }

    .wind-value {
        font-size: 1rem;
    }

    /* Ajustar calidad del aire */
    .aqi-description {
        font-size: 1.25rem;
        margin-bottom: 0.5rem;
    }

    .air-quality-scale {
        width: 90%;
        height: 8px;
    }

    .air-quality-indicator {
        width: 16px;
        height: 16px;
    }

    /* Ajustar widget de clima */
    .weather-condition-widget {
        border-radius: 12px;
        background: #fff;
    }

    .weather-icon {
        width: 60%;
        height: 60%;
    }
}

/* Ajustes específicos para pantallas muy pequeñas */
@media screen and (max-width: 360px) {
    .widget-column {
        gap: 0.25rem;
        padding: 0.25rem;
    }

    .title {
        font-size: 0.75rem;
    }

    .temperature,
    .wind-speed,
    .precipitation-chance,
    .visibility-value,
    .uv-value {
        font-size: 1.75rem;
    }
}
    </style>
</head>
<body>
    <div class="widget-column">
        <div class="weather-widget">
            <div class="title">Temperatura</div>
            <div class="temperature">24°C</div>
            <div class="location">CDMX</div>
        </div>

        <div class="wind-widget">
            <div class="title">Viento</div>
            <div class="wind-speed">12</div>
            <div class="wind-details">
                <div class="wind-detail">
                    <div class="wind-label">Dir</div>
                    <div class="wind-value">NE</div>
                </div>
                <div class="wind-detail">
                    <div class="wind-label">Ráf</div>
                    <div class="wind-value">25</div>
                </div>
            </div>
        </div>
        
        <!-- ... resto de widgets ... -->
    </div>

// Función para actualizar el icono
function updateWeatherIcon(condition) {
    const weatherWidget = document.querySelector('.weather-condition-widget');
    weatherWidget.innerHTML = weatherIcons[condition] || weatherIcons.sunny;
}

// Función para actualizar la calidad del aire
function updateAirQuality(quality) {
    const states = {
        bueno: { position: '12.5%' },
        moderado: { position: '37.5%' },
        malo: { position: '62.5%' },
        peligroso: { position: '87.5%' }
    };
    
    const description = document.querySelector('.aqi-description');
    const indicator = document.querySelector('.air-quality-indicator');
    
    description.textContent = quality.charAt(0).toUpperCase() + quality.slice(1);
    indicator.style.left = states[quality].position;
}

// Simplifica los comandos de teclado
document.addEventListener('keydown', (e) => {
    switch(e.key) {
        case '1':
            updateWeatherIcon('sunny');
            console.log('Cambiado a: Soleado');
            break;
        case '2':
            updateWeatherIcon('cloudy');
            console.log('Cambiado a: Nublado');
            break;
        case '3':
            updateWeatherIcon('rainy');
            console.log('Cambiado a: Lluvia');
            break;
        case '4':
            updateWeatherIcon('storm');
            console.log('Cambiado a: Tormenta');
            break;
    }
});

// Mostrar instrucciones en la consola
console.log('Comandos disponibles:');
console.log('Presiona 1: Soleado');
console.log('Presiona 2: Nublado');
console.log('Presiona 3: Lluvia');
console.log('Presiona 4: Tormenta');

// Inicializar con calidad moderada
updateAirQuality('moderado');
    </script>
